# Keep dependencies fresh automatically. Dependabot opens bump PRs; CI (fmt,
# clippy, tests, MSRV, audit) gates each one. `cargo audit` alone only catches
# known vulnerabilities, not stale or yanked versions, so this closes that gap.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Only update Cargo.lock within the existing Cargo.toml requirements.
    # Major version bumps (e.g. tera 1 -> 2) change APIs and the MSRV, so they
    # need a deliberate migration rather than an auto-merge PR.
    versioning-strategy: lockfile-only
    # Group all Rust bumps into a single PR to keep review noise low.
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
