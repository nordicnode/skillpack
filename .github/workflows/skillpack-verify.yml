name: Verify Agent Guidance Layer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  skillpack-verify:
    name: Verify Skillpack Guidance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 'stable'

      - name: Run skillpack verify
        run: cargo run -- verify --min-score 100
