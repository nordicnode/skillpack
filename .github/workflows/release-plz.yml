# Keep a "release PR" open that bumps `Cargo.toml`'s version and regenerates
# CHANGELOG.md from Conventional Commits. This automates the versioning +
# changelog step; the actual publish + GitHub Release + cross-compiled
# binaries still run from .github/workflows/release.yml when a `v*` tag is
# pushed (that pipeline owns cosign signing and the crates.io idempotency
# guard, so release-plz is scoped to versioning/changelog only — see
# release-plz.toml).
#
# After merging the release PR, cut the matching tag to ship it:
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# The version lives in several places that must move together: Cargo.toml's
# [package].version, the reusable workflow's `skillpack-version` default
# (.github/workflows/skillpack.yml), the committed plugin.json manifest, and
# the Homebrew formula's version + URLs (homebrew/skillpack.rb).
# release-plz only bumps Cargo.toml, so a follow-up step below ("Sync version
# files") bumps the others on the same release branch; without it the CI
# `version-sync` job (ci.yml) would fail the release PR.
#
# Authentication: prefer a PAT via the RELEASE_PLZ_TOKEN secret. When the
# release PR is authored by github-actions[bot] (the default GITHUB_TOKEN),
# GitHub puts the `pull_request`-triggered CI/verify runs into the
# "action_required" state (awaiting a maintainer's "Approve and run" click)
# to prevent recursive workflow chains. A PAT makes the PR author the token
# owner, so those runs start automatically. Without the secret it degrades to
# GITHUB_TOKEN — the release PR still works, but needs that one approval.
#   gh secret set RELEASE_PLZ_TOKEN   # a fine-grained PAT with
#                                     # contents:write + pull-requests:write
# Opening the PR also requires the repo setting "Allow GitHub Actions to
# create and approve pull requests" (Settings > Actions > General > Workflow
# permissions); without it GitHub returns 403 and the step degrades via
# `continue-on-error` below rather than failing main.
name: release-plz

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches: [main]
  # Manual trigger: `gh workflow run release-plz.yml` (or the Actions UI's
  # "Run workflow" button) opens/reopens the release PR without needing a
  # push. Useful right after the RELEASE_PLZ_TOKEN secret is first configured.
  workflow_dispatch:

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      # Gate the whole job on the PAT: without it the release PR would be
      # authored by github-actions[bot] and its CI would sit in the
      # "action_required" (awaiting approval) state on every push. Skipping
      # (rather than falling back to GITHUB_TOKEN) keeps main green and quiet
      # until the secret is added; release PRs become automatic once it is.
      HAS_PAT: ${{ secrets.RELEASE_PLZ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is required to compute the next version + changelog.
          fetch-depth: 0
          # Authenticate git operations (fetch/push of the release branch,
          # including .github/workflows/skillpack.yml) with the PAT. The
          # default GITHUB_TOKEN can never gain the `workflows` scope, so the
          # sync step's push of a workflow file would always be rejected.
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 'stable'
      - name: Run release-plz
        id: release-plz
        if: env.HAS_PAT == 'true'
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          # The action reads GITHUB_TOKEN for git auth + PR creation; point it
          # at the PAT when present so the PR author is a user, not a bot.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        # Best-effort: without the repo setting above this 403s on PR open;
        # don't let a release-note step gate the main branch. On 403 the
        # `prs_created` output is empty and the sync step below is skipped.
        continue-on-error: true

      # release-plz bumps only Cargo.toml/Cargo.lock/CHANGELOG.md. Bump the
      # other version locations (plugin.json, skillpack.yml, and the Homebrew
      # formula) on the same branch so the CI `version-sync` + self-dogfood
      # `verify` jobs stay green on the release PR.
      - name: Sync version files into the release PR
        if: steps.release-plz.outputs.prs_created == 'true'
        run: |
          set -euo pipefail
          # Use the action's `pr` output (the exact PR release-plz just
          # opened) instead of searching by the `release` label. GitHub's
          # search index is eventually consistent, and a previous release PR
          # that still carries the label can be returned, causing the sync to
          # land on a stale branch (observed in the field). The `pr` output is
          # authoritative JSON: {"number":N,"head_branch":"..."}.
          pr_number=$(printf '%s' '${{ steps.release-plz.outputs.pr }}' | jq -r '.number')
          branch=$(printf '%s' '${{ steps.release-plz.outputs.pr }}' | jq -r '.head_branch')
          if [ -z "$pr_number" ] || [ "$pr_number" = "null" ]; then
            echo "release-plz reported no PR; skipping version-file sync"
            exit 0
          fi
          echo "release PR #$pr_number on branch '$branch'"
          git fetch origin "$branch"
          git checkout -f -B "$branch" "origin/$branch"
          ver=$(awk 'BEGIN{in_pkg=0} /^\[package\]/{in_pkg=1; next} /^\[/{in_pkg=0} in_pkg && /^version[[:space:]]*=/{gsub(/[" ]/, "", $3); print $3; exit}' Cargo.toml)
          echo "syncing version files to $ver"
          sed -i -E "s/\"version\": \"[0-9]+\.[0-9]+\.[0-9]+\"/\"version\": \"$ver\"/" .claude-plugin/plugin.json
          sed -i -E "s/(default: ')[0-9]+\.[0-9]+\.[0-9]+(')/\1$ver\2/" .github/workflows/skillpack.yml
          # Homebrew formula: the `version "X.Y.Z"` line plus the four
          # release-download URLs it pins.
          sed -i -E "s/version \"[0-9]+\.[0-9]+\.[0-9]+\"/version \"$ver\"/" homebrew/skillpack.rb
          sed -i -E "s#/v[0-9]+\.[0-9]+\.[0-9]+/#/v$ver/#g" homebrew/skillpack.rb
          # Per-binary sha256 pins cannot be recomputed until the release is
          # published; replace them with a reminder comment so a bumped
          # version never ships a stale checksum. The Release workflow's
          # `re-pin-homebrew` job (fired by the v* tag push) re-pins them
          # automatically once the binaries are uploaded.
          sed -i -E 's|^[[:space:]]*sha256 .*$|# TODO: re-pin sha256 via scripts/update_homebrew_sha256.py after the release is published|' homebrew/skillpack.rb
          # README's pin examples (`@vX.Y.Z` workflow pin + `rev: vX.Y.Z`
          # pre-commit pin) should track the latest release too.
          sed -i -E "s/@v[0-9]+\.[0-9]+\.[0-9]+/@v$ver/g" README.md
          sed -i -E "s/rev: v[0-9]+\.[0-9]+\.[0-9]+/rev: v$ver/g" README.md
          if git diff --quiet; then
            echo "version files already in sync; nothing to commit"
          else
            git add .claude-plugin/plugin.json .github/workflows/skillpack.yml homebrew/skillpack.rb README.md
            git commit -m "chore: sync plugin.json, skillpack.yml, homebrew formula and README pins to $ver"
            git push origin "$branch"
          fi

      # Hygiene: every run of this workflow opens a new `release-plz-*`
      # branch, and merged/closed release PRs leave their branches behind
      # forever (12 accumulated before this step existed). Delete every
      # `release-plz-*` branch whose PR is no longer open, keeping only the
      # PR this run just opened/reopened.
      - name: Prune stale release-plz branches
        run: |
          set -euo pipefail
          keep="${{ steps.release-plz.outputs.pr != '' && (steps.release-plz.outputs.pr | fromJSON).head_branch || '' }}"
          for b in $(gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | grep '^release-plz-' || true); do
            if [ "$b" = "$keep" ]; then
              echo "keeping $b (this run's PR)"
              continue
            fi
            state=$(gh pr list --head "$b" --state all --json state --jq '.[0].state' 2>/dev/null || echo "")
            if [ "$state" = "OPEN" ]; then
              echo "keeping $b (open PR)"
              continue
            fi
            echo "deleting stale branch $b (state=${state:-unknown})"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$b" || echo "  (delete failed; branch may already be gone)"
          done
