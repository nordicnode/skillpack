# Keep a "release PR" open that bumps `Cargo.toml`'s version and regenerates
# CHANGELOG.md from Conventional Commits. This automates the versioning +
# changelog step; the actual publish + GitHub Release + cross-compiled
# binaries still run from .github/workflows/release.yml when a `v*` tag is
# pushed (that pipeline owns cosign signing and the crates.io idempotency
# guard, so release-plz is scoped to versioning/changelog only — see
# release-plz.toml).
#
# After merging the release PR, cut the matching tag to ship it:
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# The version lives in three places that must move together: Cargo.toml's
# [package].version, the reusable workflow's `skillpack-version` default
# (.github/workflows/skillpack.yml), and the committed plugin.json manifest.
# release-plz only bumps Cargo.toml, so a follow-up step below ("Sync version
# files") bumps the other two on the same release branch; without it the CI
# `version-sync` job (ci.yml) would fail the release PR.
#
# Authentication: prefer a PAT via the RELEASE_PLZ_TOKEN secret. When the
# release PR is authored by github-actions[bot] (the default GITHUB_TOKEN),
# GitHub puts the `pull_request`-triggered CI/verify runs into the
# "action_required" state (awaiting a maintainer's "Approve and run" click)
# to prevent recursive workflow chains. A PAT makes the PR author the token
# owner, so those runs start automatically. Without the secret it degrades to
# GITHUB_TOKEN — the release PR still works, but needs that one approval.
#   gh secret set RELEASE_PLZ_TOKEN   # a fine-grained PAT with
#                                     # contents:write + pull-requests:write
# Opening the PR also requires the repo setting "Allow GitHub Actions to
# create and approve pull requests" (Settings > Actions > General > Workflow
# permissions); without it GitHub returns 403 and the step degrades via
# `continue-on-error` below rather than failing main.
name: release-plz

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches: [main]
  # Manual trigger: `gh workflow run release-plz.yml` (or the Actions UI's
  # "Run workflow" button) opens/reopens the release PR without needing a
  # push. Useful right after the RELEASE_PLZ_TOKEN secret is first configured.
  workflow_dispatch:

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      # Gate the whole job on the PAT: without it the release PR would be
      # authored by github-actions[bot] and its CI would sit in the
      # "action_required" (awaiting approval) state on every push. Skipping
      # (rather than falling back to GITHUB_TOKEN) keeps main green and quiet
      # until the secret is added; release PRs become automatic once it is.
      HAS_PAT: ${{ secrets.RELEASE_PLZ_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is required to compute the next version + changelog.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 'stable'
      - name: Run release-plz
        id: release-plz
        if: env.HAS_PAT == 'true'
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          # The action reads GITHUB_TOKEN for git auth + PR creation; point it
          # at the PAT when present so the PR author is a user, not a bot.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        # Best-effort: without the repo setting above this 403s on PR open;
        # don't let a release-note step gate the main branch. On 403 the
        # `prs_created` output is empty and the sync step below is skipped.
        continue-on-error: true

      # release-plz bumps only Cargo.toml/Cargo.lock/CHANGELOG.md. Bump the two
      # other version locations (plugin.json, skillpack.yml) on the same branch
      # so the CI `version-sync` + self-dogfood `verify` jobs stay green on the
      # release PR.
      - name: Sync version files into the release PR
        if: steps.release-plz.outputs.prs_created == 'true'
        run: |
          set -euo pipefail
          # The PR was created milliseconds ago; GitHub's search index (used by
          # `gh pr list --label`) is eventually consistent, so a single query
          # can miss the just-opened PR (observed: "no pull requests found").
          # Retry briefly before giving up; `// empty` maps a missing list to
          # an empty string so the loop keeps trying instead of parsing null.
          pr_number=""
          for _ in $(seq 1 12); do
            pr_number=$(gh pr list --label release --state open --limit 1 --json number -q '.[0].number // empty')
            if [ -n "$pr_number" ]; then
              break
            fi
            sleep 5
          done
          if [ -z "$pr_number" ]; then
            echo "could not find the release PR (label 'release'); skipping version-file sync"
            exit 0
          fi
          branch=$(gh pr view "$pr_number" --json headRefName -q '.headRefName')
          echo "release PR #$pr_number on branch '$branch'"
          git fetch origin "$branch"
          git checkout -f -B "$branch" "origin/$branch"
          ver=$(awk 'BEGIN{in_pkg=0} /^\[package\]/{in_pkg=1; next} /^\[/{in_pkg=0} in_pkg && /^version[[:space:]]*=/{gsub(/[" ]/, "", $3); print $3; exit}' Cargo.toml)
          echo "syncing version files to $ver"
          sed -i -E "s/\"version\": \"[0-9]+\.[0-9]+\.[0-9]+\"/\"version\": \"$ver\"/" .claude-plugin/plugin.json
          sed -i -E "s/(default: ')[0-9]+\.[0-9]+\.[0-9]+(')/\1$ver\2/" .github/workflows/skillpack.yml
          if git diff --quiet; then
            echo "version files already in sync; nothing to commit"
          else
            git add .claude-plugin/plugin.json .github/workflows/skillpack.yml
            git commit -m "chore: sync plugin.json and skillpack.yml to $ver"
            git push origin "$branch"
          fi
