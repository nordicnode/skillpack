# Publish to crates.io on a pushed `v*` tag (design §11: V1 publishes to
# crates.io). The crate must already pass CI on `main`; this only fires from a
# tag, so cut a tag only after the `main` CI run is green.
#
# The crate.io token is the `CARGO_REGISTRY_TOKEN` repo secret — set once via:
#   gh secret set CARGO_REGISTRY_TOKEN
# It never lives in a file or in the chat.
name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Match the pinned toolchain in rust-toolchain.toml so the published
      # crate is built with the same rustc we tested under.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
      - name: Verify the tag version matches Cargo.toml
        # Read `version` only from the `[package]` table (not a bare `^version`
        # grep, which would break if a workspace-level `version` line ever
        # appears above it).
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          cargo_ver=$(awk 'BEGIN{in_pkg=0} /^\[package\]/{in_pkg=1; next} /^\[/{in_pkg=0} in_pkg && /^version[[:space:]]*=/{gsub(/[" ]/, "", $3); print $3; exit}' Cargo.toml)
          if [ "$tag" != "v$cargo_ver" ]; then
            echo "Tag $tag does not match Cargo.toml version $cargo_ver (expected v$cargo_ver)"
            exit 1
          fi
      # A vulnerability disclosed AFTER the last `main` CI run (which audits
      # on every push/PR) must still block publishing. Cheap relative to the
      # publish itself; fails the job on any advisory in the locked tree.
      # Install a prebuilt binary instead of compiling from source.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
      # Idempotency guard: if this version already made it to crates.io (e.g.
      # a tag was moved to re-run the binaries job), skip the publish instead
      # of failing on "crate version already uploaded".
      - name: Check version not already on crates.io
        run: |
          cargo_ver=$(awk 'BEGIN{in_pkg=0} /^\[package\]/{in_pkg=1; next} /^\[/{in_pkg=0} in_pkg && /^version[[:space:]]*=/{gsub(/[" ]/, "", $3); print $3; exit}' Cargo.toml)
          # `-sSL` (no `-f`) so a 404 (brand-new crate with no index entry yet)
          # or an empty index still greps cleanly instead of curl exiting
          # non-zero. The `if` guards the grep match; publish only skips when
          # the version string is actually present in the index.
          if curl -sSL https://index.crates.io/sk/il/skillpack | grep -q "\"vers\":\"${cargo_ver}\""; then
            echo "Version ${cargo_ver} already published; skipping cargo publish"
            echo "SKIP_PUBLISH=true" >> "$GITHUB_ENV"
          fi
      - name: cargo publish
        if: env.SKIP_PUBLISH != 'true'
        run: cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Create the GitHub Release with notes parsed from the CHANGELOG entry for
  # this version. The upload action below only uploads assets to an existing
  # release, so this must finish before the matrix starts.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md

  # Build prebuilt binaries for common platforms and attach them to the GitHub
  # Release. This is what makes `cargo binstall skillpack` work and lets users
  # without a Rust toolchain install instantly.
  #
  # The upload action accepts exactly ONE target per invocation, so a matrix
  # runs it once per platform. Linux arm64 builds on ubuntu via `cross`
  # (docker image exists); both macOS archs build on macos-latest — the
  # action switches to plain cargo with `rustup target add` for apple targets
  # on a macOS host, and cross-compiling x86_64 from the arm64 runner works
  # because the Xcode SDK is universal (macos-13, the last Intel runner, was
  # retired Dec 2025). Windows builds natively (MSVC can't be built elsewhere).
  binaries:
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      # Keyless cosign signing needs an OIDC token to attest the build.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
      - name: Build and upload release binaries
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: skillpack
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
      # Sign the built binary keylessly (GitHub OIDC identity, no keys to
      # manage) and attach the cosign bundle as a release asset so `cargo
      # binstall` / `cosign verify-blob` users can verify provenance.
      - uses: sigstore/cosign-installer@main
      - name: Sign binary
        run: |
          bin="target/${{ matrix.target }}/release/skillpack"
          [ "${{ matrix.os }}" = "windows-latest" ] && bin="${bin}.exe"
          cosign sign-blob --yes --bundle "skillpack-${{ matrix.target }}.bundle" "$bin"
      - name: Upload signature bundle
        run: gh release upload "${{ github.ref_name }}" "skillpack-${{ matrix.target }}.bundle"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
