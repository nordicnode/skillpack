# Publish to crates.io on a pushed `v*` tag (design §11: V1 publishes to
# crates.io). The crate must already pass CI on `main`; this only fires from a
# tag, so cut a tag only after the `main` CI run is green.
#
# The crate.io token is the `CARGO_REGISTRY_TOKEN` repo secret — set once via:
#   gh secret set CARGO_REGISTRY_TOKEN
# It never lives in a file or in the chat.
name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Match the pinned toolchain in rust-toolchain.toml so the published
      # crate is built with the same rustc we tested under.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
      - name: Verify the tag version matches Cargo.toml
        # Read `version` only from the `[package]` table (not a bare `^version`
        # grep, which would break if a workspace-level `version` line ever
        # appears above it).
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          cargo_ver=$(awk 'BEGIN{in_pkg=0} /^\[package\]/{in_pkg=1; next} /^\[/{in_pkg=0} in_pkg && /^version[[:space:]]*=/{gsub(/[" ]/, "", $3); print $3; exit}' Cargo.toml)
          if [ "$tag" != "v$cargo_ver" ]; then
            echo "Tag $tag does not match Cargo.toml version $cargo_ver (expected v$cargo_ver)"
            exit 1
          fi
      # A vulnerability disclosed AFTER the last `main` CI run (which audits
      # on every push/PR) must still block publishing. Cheap relative to the
      # publish itself; fails the job on any advisory in the locked tree.
      - name: cargo audit
        run: cargo install cargo-audit --locked && cargo audit
      - name: cargo publish
        run: cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Build prebuilt binaries for common platforms and attach them to the GitHub
  # Release. This is what makes `cargo binstall skillpack` work and lets users
  # without a Rust toolchain install instantly. Runs on the same tag push; the
  # action creates the GitHub Release if it doesn't exist yet.
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
      - name: Build and upload release binaries
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: skillpack
          target: |
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            x86_64-apple-darwin
            aarch64-apple-darwin
            x86_64-pc-windows-msvc
          token: ${{ secrets.GITHUB_TOKEN }}
