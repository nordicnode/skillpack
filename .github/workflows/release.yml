# Publish to crates.io on a pushed `v*` tag (design §11: V1 publishes to
# crates.io). The crate must already pass CI on `main`; this only fires from a
# tag, so cut a tag only after the `main` CI run is green.
#
# The crate.io token is the `CARGO_REGISTRY_TOKEN` repo secret — set once via:
#   gh secret set CARGO_REGISTRY_TOKEN
# It never lives in a file or in the chat.
name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Match the pinned toolchain in rust-toolchain.toml so the published
      # crate is built with the same rustc we tested under.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
      # No rust-cache here: `cargo publish` stages the package under
      # `target/package/<crate>-<ver>/`, whose `tests/` directory trips
      # rust-cache's post-job cleanup (it opendir()s `tests/target` and
      # `tests/trybuild`, which don't exist in this crate, and logs two
      # unhandled-ENOENT `##[error]` annotations on an otherwise green job).
      # The publish job runs once per version and its cache key changes with
      # every bump anyway, so caching buys nothing and only adds the noise.
      - name: Verify the tag version matches Cargo.toml
        # Read `version` only from the `[package]` table (not a bare `^version`
        # grep, which would break if a workspace-level `version` line ever
        # appears above it).
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          cargo_ver=$(awk 'BEGIN{in_pkg=0} /^\[package\]/{in_pkg=1; next} /^\[/{in_pkg=0} in_pkg && /^version[[:space:]]*=/{gsub(/[" ]/, "", $3); print $3; exit}' Cargo.toml)
          if [ "$tag" != "v$cargo_ver" ]; then
            echo "Tag $tag does not match Cargo.toml version $cargo_ver (expected v$cargo_ver)"
            exit 1
          fi
      # A vulnerability disclosed AFTER the last `main` CI run (which audits
      # on every push/PR) must still block publishing. Cheap relative to the
      # publish itself; fails the job on any advisory in the locked tree.
      # Install a prebuilt binary instead of compiling from source.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
      # Idempotency guard: if this version already made it to crates.io (e.g.
      # a tag was moved to re-run the binaries job), skip the publish instead
      # of failing on "crate version already uploaded".
      - name: Check version not already on crates.io
        run: |
          cargo_ver=$(awk 'BEGIN{in_pkg=0} /^\[package\]/{in_pkg=1; next} /^\[/{in_pkg=0} in_pkg && /^version[[:space:]]*=/{gsub(/[" ]/, "", $3); print $3; exit}' Cargo.toml)
          # `-sSL` (no `-f`) so a 404 (brand-new crate with no index entry yet)
          # or an empty index still greps cleanly instead of curl exiting
          # non-zero. The `if` guards the grep match; publish only skips when
          # the version string is actually present in the index.
          if curl -sSL https://index.crates.io/sk/il/skillpack | grep -q "\"vers\":\"${cargo_ver}\""; then
            echo "Version ${cargo_ver} already published; skipping cargo publish"
            echo "SKIP_PUBLISH=true" >> "$GITHUB_ENV"
          fi
      - name: cargo publish
        if: env.SKIP_PUBLISH != 'true'
        run: cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Create the GitHub Release with notes parsed from the CHANGELOG entry for
  # this version. The upload action below only uploads assets to an existing
  # release, so this must finish before the matrix starts.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # Idempotency guard: re-pointing a tag to re-run the binaries (e.g.
      # after a signing fix) must not fail on "release already exists".
      - name: Check release not already created
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} already exists; skipping create"
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub Release
        if: env.SKIP_RELEASE != 'true'
        uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md

  # Build prebuilt binaries for common platforms and attach them to the GitHub
  # Release. This is what makes `cargo binstall skillpack` work and lets users
  # without a Rust toolchain install instantly.
  #
  # The upload action accepts exactly ONE target per invocation, so a matrix
  # runs it once per platform. Linux arm64 builds on ubuntu via `cross`
  # (docker image exists); both macOS archs build on macos-latest — the
  # action switches to plain cargo with `rustup target add` for apple targets
  # on a macOS host, and cross-compiling x86_64 from the arm64 runner works
  # because the Xcode SDK is universal (macos-13, the last Intel runner, was
  # retired Dec 2025). Windows builds natively (MSVC can't be built elsewhere).
  binaries:
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      # Keyless cosign signing needs an OIDC token to attest the build.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          # Static musl build: runs on any Linux distro with no glibc
          # dependency — the artifact the Homebrew formula + install.sh fetch.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
      - name: Build and upload release binaries
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: skillpack
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
      # Sign the built binary keylessly (GitHub OIDC identity, no keys to
      # manage) and attach the cosign bundle as a release asset so `cargo
      # binstall` / `cosign verify-blob` users can verify provenance.
      - uses: sigstore/cosign-installer@main
      - name: Sign binary
        # `shell: bash` is required: Windows defaults to PowerShell, which
        # would fail to parse the `[ ... ] && ...` / `${bin}` syntax below.
        # Git Bash is preinstalled on windows-latest runners.
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/skillpack"
          [ "${{ matrix.os }}" = "windows-latest" ] && bin="${bin}.exe"
          cosign sign-blob --yes --bundle "skillpack-${{ matrix.target }}.bundle" "$bin"
      - name: Upload signature bundle
        shell: bash
        # --clobber: a re-pointed tag re-run re-uploads bundles that the first
        # run already attached; overwrite instead of failing on "asset exists".
        run: gh release upload --clobber "${{ github.ref_name }}" "skillpack-${{ matrix.target }}.bundle"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Re-pin the Homebrew formula's per-binary sha256 pins against the release
  # the `binaries` job just uploaded, and land them on main. Previously this
  # was a manual post-release step (`python3 scripts/update_homebrew_sha256.py`)
  # and later a direct push to main; the formula is uninstallable without the
  # pins, so the ci.yml checksum guard keeps main red until they land.
  #
  # Main is protected by the `protect-main` ruleset (PR required + CI checks),
  # which the GITHUB_TOKEN cannot bypass — so this job opens a PR and enables
  # auto-merge instead of pushing directly. Must run after the binaries exist —
  # the script downloads each tarball from the release to hash it.
  re-pin-homebrew:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # The PR must be authored by a real token owner, not github-actions[bot]:
      # bot-authored PRs put `pull_request` CI into the "action_required"
      # (awaiting approval) state, which would stall auto-merge. Prefer the
      # PAT used by release-plz; degrade to GITHUB_TOKEN if it's unset.
      GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the pin commit can be rebased onto current main
          # before pushing (the tag is usually main HEAD at this point, but a
          # concurrent merge would otherwise make the push non-fast-forward).
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Re-pin formula checksums from the published release
        run: python3 scripts/update_homebrew_sha256.py
      - name: Commit the pinned formula and open an auto-merged PR
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homebrew/skillpack.rb
          if git diff --cached --quiet; then
            echo "formula checksums already pinned; nothing to commit"
            exit 0
          fi
          branch="chore/re-pin-homebrew-${GITHUB_REF_NAME#v}"
          git checkout -b "$branch"
          git commit -m "chore: re-pin homebrew sha256 pins for ${GITHUB_REF_NAME}"
          git fetch origin main
          git rebase origin/main
          # The rebased formula must still reference this tag's version — if a
          # newer release PR landed on main in the meantime, re-pinning would
          # stamp stale checksums over a bumped formula. Fail loudly instead.
          ver=$(grep -oP 'version "\K[0-9]+\.[0-9]+\.[0-9]+' homebrew/skillpack.rb | head -1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$ver" != "$tag" ]; then
            echo "::error::homebrew formula version $ver does not match tag $tag after rebase; refusing to open PR"
            exit 1
          fi
          git push origin "$branch"
          pr_url=$(gh pr create \
            --base main --head "$branch" \
            --title "chore: re-pin homebrew sha256 pins for ${GITHUB_REF_NAME}" \
            --body "Auto-generated by the Release workflow: re-pins the per-binary \
          sha256 checksums in homebrew/skillpack.rb against the assets uploaded \
          to the ${GITHUB_REF_NAME} release. Auto-merged once CI passes.")
          echo "opened $pr_url"
          # Auto-merge once the required checks pass; the PR is authored by the
          # PAT owner so its CI starts without a manual approval click.
          gh pr merge --auto --squash "$branch"
          echo "auto-merge enabled for $branch"

  # End-to-end smoke test of the one-command installer. After the binaries
  # are uploaded, run install.sh against the just-created release and confirm
  # the installed binary executes. Catches a missing or mismapped asset (the
  # Linux ARM musl 404 fixed in 0.13.0) before a user hits it. install.sh
  # already runs `skillpack --version` on the installed binary and exits
  # non-zero on any failure (`set -eu`), so this step IS the assertion.
  smoke:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: smoke-test install.sh
        env:
          VERSION: ${{ github.ref_name }}
          SKILLPACK_INSTALL_DIR: ${{ runner.temp }}/skillpack-bin
        run: sh install.sh
